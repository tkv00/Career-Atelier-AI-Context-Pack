  <g id="text_23">
   <text style="fill: #536274; font: 10px 'AppleGothic'" transform="translate(7.2 271.254937)">100%는 이 표본의 결과이며, 임의 서식 문서나 실제 사용자 데이터의 일반 정확도가 아님.</text>
   <text style="fill: #536274; font: 10px 'AppleGothic'" transform="translate(7.2 282.384)">Notion은 고정 응답 테스트만 실시했으며 위 표와 시간 측정에는 포함하지 않음.</text>
