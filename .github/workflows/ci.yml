name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.13.0', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            runner/package-lock.json
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: npm ci --prefix runner
      - run: npm run check:version
      - run: npm test

  web:
    name: Web checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 실제 계정에 연결하지 않는 빌드 전용 값.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-not-a-real-key
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install --global npm@10.9.2
      - run: npm ci --prefix web
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run lint
      - run: npm --prefix web run build
